<!DOCTYPE html>
<html lang="zh_CN" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Loading Preview</title>
  <style>
    html, body, #app {
      height: 100%; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    }

    /* 主题切换辅助按钮 */
    .theme-toggle {
      position: fixed; top: 16px; right: 16px; z-index: 100;
      padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; background: rgba(0,0,0,0.3);
      color: rgba(255,255,255,0.7); font-size: 13px;
      cursor: pointer; backdrop-filter: blur(8px);
      transition: all 0.2s;
      font-family: inherit;
    }
    .theme-toggle:hover {
      background: rgba(0,0,0,0.5);
      color: #fff;
    }
    html[data-theme='dark'] .theme-toggle {
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
    }
    html[data-theme='dark'] .theme-toggle:hover {
      background: rgba(255,255,255,0.15);
    }

    /* ===== 主题变量 ===== */
    .app-loading-next {
      --ld-bg: #f4f7fa;
      --ld-orb-1: rgba(24, 144, 255, 0.18);
      --ld-orb-2: rgba(0, 150, 136, 0.14);
      --ld-orb-3: rgba(114, 46, 209, 0.12);
      --ld-orb-4: rgba(255, 184, 0, 0.12);
      --ld-grid: rgba(0, 0, 0, 0.03);
      --ld-text: #2c3e50;
      --ld-text-dim: #94a3b8;
      --ld-brand: #1a1a2e;
      --ld-progress-bg: rgba(0, 0, 0, 0.06);
      --ld-progress-fill: #1890ff;
      --ld-footer: #94a3b8;
    }
    html[data-theme='dark'] .app-loading-next {
      --ld-bg: #141824;
      --ld-orb-1: rgba(24, 144, 255, 0.22);
      --ld-orb-2: rgba(0, 150, 136, 0.16);
      --ld-orb-3: rgba(114, 46, 209, 0.14);
      --ld-orb-4: rgba(255, 184, 0, 0.12);
      --ld-grid: rgba(255, 255, 255, 0.02);
      --ld-text: rgba(255, 255, 255, 0.85);
      --ld-text-dim: rgba(255, 255, 255, 0.35);
      --ld-brand: rgba(255, 255, 255, 0.90);
      --ld-progress-bg: rgba(255, 255, 255, 0.08);
      --ld-progress-fill: #1890ff;
      --ld-footer: rgba(255, 255, 255, 0.30);
    }

    /* ---- 容器 ---- */
    .app-loading-next {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      height: 100%;
      background: var(--ld-bg);
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* ---- 浮动光晕（带视差容器） ---- */
    .ld-ambient {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .ld-orb-wrap {
      position: absolute; inset: 0;
      will-change: transform;
    }
    .ld-orb {
      position: absolute; border-radius: 50%; filter: blur(80px); will-change: transform;
    }
    .ld-orb-1 {
      width: 600px; height: 600px; top: -15%; left: -10%;
      background: var(--ld-orb-1);
      animation: ld-drift-1 25s ease-in-out infinite;
    }
    .ld-orb-2 {
      width: 500px; height: 500px; bottom: -10%; right: -5%;
      background: var(--ld-orb-2);
      animation: ld-drift-2 20s ease-in-out infinite;
    }
    .ld-orb-3 {
      width: 400px; height: 400px; top: 40%; right: 15%;
      background: var(--ld-orb-3);
      animation: ld-drift-3 30s ease-in-out infinite;
    }
    .ld-orb-4 {
      width: 300px; height: 300px; bottom: 25%; left: 10%;
      background: var(--ld-orb-4);
      animation: ld-drift-4 22s ease-in-out infinite;
    }
    @keyframes ld-drift-1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(120px,80px) scale(1.1); }
      66% { transform: translate(-60px,160px) scale(0.95); }
    }
    @keyframes ld-drift-2 {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(-100px,-60px) scale(1.15); }
      66% { transform: translate(60px,-120px) scale(0.9); }
    }
    @keyframes ld-drift-3 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(80px,-100px) scale(1.2); }
    }
    @keyframes ld-drift-4 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(-80px,60px) scale(1.1); }
    }

    /* ---- 网格纹理 ---- */
    .ld-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(var(--ld-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--ld-grid) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 60% 50% at center, black 20%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at center, black 20%, transparent 70%);
    }

    /* ---- 中心内容 ---- */
    .ld-center {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 40px;
    }

    /* ---- Logo ---- */
    .ld-brand { display: flex; flex-direction: column; align-items: center; gap: 0; }
    .ld-logo { width: 120px; height: 120px; border-radius: 12px;
      animation: ld-float 3s ease-in-out infinite; }
    .ld-brand-name {
      font-size: 32px; font-weight: 500; letter-spacing: 6px;
      background: linear-gradient(135deg, #1890ff 0%, #53d187 50%, #c084fc 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px rgba(24,144,255,0.2));
      opacity: 0; animation: ld-fade-up 0.6s 0.2s ease forwards, ld-shimmer 4s ease-in-out infinite 0.8s;
    }
    @keyframes ld-shimmer {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes ld-float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .ld-star { animation: ld-twinkle 2s ease-in-out infinite; animation-delay: var(--sd,0s); transform-origin: center; }
    @keyframes ld-twinkle {
      0%,100% { opacity: 0.3; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .ld-tip { animation: ld-tip-color 4s ease-in-out infinite; }
    @keyframes ld-tip-color {
      0% { fill: #fbbf24; }
      25% { fill: #34d399; }
      50% { fill: #60a5fa; }
      75% { fill: #c084fc; }
      100% { fill: #fbbf24; }
    }

    /* ---- 文字轮播（交叉淡入淡出） ---- */
    .ld-carousel { opacity: 0; animation: ld-fade-up 0.6s 0.4s ease forwards; }
    .ld-cp-view { height: 52px; display: flex; align-items: center; justify-content: center; }
    .ld-cp-item {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .ld-cp-item.is-hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }
    .ld-cp-icon { font-size: 14px; color: var(--ld-progress-fill); opacity: 0.6; flex-shrink: 0; }
    .ld-cp-text {
      font-size: 28px; font-weight: 300; letter-spacing: 1px;
      color: var(--ld-text); white-space: nowrap;
    }

    /* ---- 进度条 ---- */
    .ld-progress {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      width: 200px; opacity: 0; animation: ld-fade-up 0.6s 0.6s ease forwards;
    }
    .ld-pbar { width: 100%; height: 2px; border-radius: 2px; background: var(--ld-progress-bg); overflow: hidden; }
    .ld-pfill {
      height: 100%; width: 0%; border-radius: 2px;
      background: linear-gradient(90deg, var(--ld-progress-fill), #53d187, var(--ld-progress-fill));
      background-size: 200% 100%;
      transition: width 0.4s ease;
    }
    .ld-plabel {
      font-size: 12px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase;
      color: var(--ld-text-dim);
    }

    /* ---- 底部信息 ---- */
    .ld-footer {
      position: absolute; bottom: 32px; z-index: 1;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--ld-footer); letter-spacing: 0.5px;
      opacity: 0; animation: ld-fade-up 0.8s 0.8s ease forwards;
    }
    .ld-fdot { opacity: 0.4; }

    @keyframes ld-fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">🌓 切换主题</button>

  <div id="app" style="height:100%">
    <div class="app-loading-next">
      <!-- 鼠标互动：光晕随呼吸若隐若现 -->
      <div class="ld-ambient" id="ambientLayer">
        <div class="ld-orb-wrap" data-parallax="1"><div class="ld-orb ld-orb-1"></div></div>
        <div class="ld-orb-wrap" data-parallax="1.5"><div class="ld-orb ld-orb-2"></div></div>
        <div class="ld-orb-wrap" data-parallax="2"><div class="ld-orb ld-orb-3"></div></div>
        <div class="ld-orb-wrap" data-parallax="2.5"><div class="ld-orb ld-orb-4"></div></div>
      </div>
      <div class="ld-grid"></div>

      <div class="ld-center">
        <div class="ld-brand">
          <svg class="ld-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="sparkle-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <!-- 水波涟漪 -->
            <circle cx="75" cy="28" r="8" stroke="#1890ff" stroke-width="1.5" fill="none" opacity="0.3"/>
            <circle cx="75" cy="28" r="16" stroke="#1890ff" stroke-width="1" fill="none" opacity="0.15"/>
            <circle cx="75" cy="28" r="26" stroke="#1890ff" stroke-width="0.8" fill="none" opacity="0.08"/>
            <!-- 乐团弧线 -->
            <path d="M 6 97.5 C 6 40, 94 40, 94 97.5" stroke="#1890ff" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.25"/>
            <!-- 彩色四角星 -->
            <path class="ld-star" d="M 21 61 C 21 63, 24 64.5, 28 62 C 24 63.5, 21 65, 21 67 C 21 65, 18 63.5, 14 62 C 18 64.5, 21 63, 21 61 Z" fill="#fbbf24" filter="url(#sparkle-glow)" style="--sd:0s"/>
            <path class="ld-star" d="M 36 48 C 36 49.5, 38 51, 41 49 C 38 50, 36 51.5, 36 53 C 36 51.5, 34 50, 31 49 C 34 51, 36 49.5, 36 48 Z" fill="#f472b6" filter="url(#sparkle-glow)" style="--sd:0.7s"/>
            <path class="ld-star" d="M 54 45 C 54 47, 56.5 48.5, 59 46 C 56.5 47.5, 54 49, 54 51 C 54 49, 51.5 47.5, 49 46 C 51.5 48.5, 54 47, 54 45 Z" fill="#34d399" filter="url(#sparkle-glow)" style="--sd:1.4s"/>
            <path class="ld-star" d="M 72 49 C 72 50.5, 74 52, 77 50 C 74 51, 72 52.5, 72 54 C 72 52.5, 70 51, 67 50 C 70 52, 72 50.5, 72 49 Z" fill="#c084fc" filter="url(#sparkle-glow)" style="--sd:0.3s"/>
            <path class="ld-star" d="M 83 61 C 83 63, 85.5 64.5, 89 62 C 85.5 63.5, 83 65, 83 67 C 83 65, 80.5 63.5, 77 62 C 80.5 64.5, 83 63, 83 61 Z" fill="#60a5fa" filter="url(#sparkle-glow)" style="--sd:1.1s"/>
            <!-- 指挥棒 -->
            <line x1="26" y1="72" x2="75" y2="28" stroke="#1890ff" stroke-width="6" stroke-linecap="round"/>
            <!-- 棒尖 -->
            <circle cx="75" cy="28" r="5" fill="#fbbf24" class="ld-tip"/>
          </svg>
          <div class="ld-brand-name">趋山海-乐趋</div>
        </div>

        <div class="ld-carousel">
          <div class="ld-cp-view">
            <div class="ld-cp-item" id="carouselItem">
              <span class="ld-cp-icon" id="carouselIcon">✦</span>
              <span class="ld-cp-text" id="carouselText">志所趋,无远勿界 穷山巨海,不能限</span>
            </div>
          </div>
        </div>

        <div class="ld-progress">
          <div class="ld-pbar"><div class="ld-pfill" id="loadProgress" style="width:0%"></div></div>
          <div class="ld-plabel">Loading</div>
        </div>
      </div>

      <div class="ld-footer">
        <span>© 2026</span>
        <span class="ld-fdot">·</span>
        <span>v2.0</span>
      </div>
    </div>
  </div>

  <script>
    // ===== 文案（随机顺序，为后续 API 缓存准备） =====
    var taglines = [
      { icon: '✦', text: '志所趋,无远勿界 穷山巨海,不能限' },
      { icon: '◆', text: '知止而后有定,定而后能静' },
      { icon: '◈', text: '博观而约取,厚积而薄发' },
      { icon: '◇', text: '流水不争先,争的是滔滔不绝' },
      { icon: '▣', text: '行远自迩,登高自卑' },
    ];

    // ===== 文字轮播（交叉淡入淡出，随机不重复） =====
    (function() {
      var iconEl = document.getElementById('carouselIcon');
      var textEl = document.getElementById('carouselText');
      var itemEl = document.getElementById('carouselItem');
      if (!iconEl || !textEl || !itemEl) return;

      var currentIdx = -1;

      function pickNext() {
        var next;
        // 后续可接入 API：先尝试从缓存读取，没有再随机
        do {
          next = Math.floor(Math.random() * taglines.length);
        } while (next === currentIdx && taglines.length > 1);
        return next;
      }

      function showTagline(idx) {
        currentIdx = idx;
        iconEl.textContent = taglines[idx].icon;
        textEl.textContent = taglines[idx].text;
      }

      function rotate() {
        // 淡出
        itemEl.classList.add('is-hidden');
        setTimeout(function() {
          // 切文案
          showTagline(pickNext());
          // 淡入
          itemEl.classList.remove('is-hidden');
        }, 400);
      }

      // 初始显示
      showTagline(0);
      setInterval(rotate, 4000);
    })();

    // ===== 鼠标背景互动（若隐若现呼吸效果） =====
    (function() {
      var orbWraps = document.querySelectorAll('.ld-orb-wrap');
      if (!orbWraps.length) return;

      var mx = 0, my = 0;
      var targetX = 0, targetY = 0;
      var glow = 0.7, targetGlow = 0.7;
      var idleTimer;

      document.addEventListener('mousemove', function(e) {
        targetX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetY = (e.clientY / window.innerHeight - 0.5) * 2;
        targetGlow = 1.3;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function() {
          targetGlow = 0.7;
        }, 2000);
      });
      setTimeout(function() { targetGlow = 0.7; }, 2000);

      function animate() {
        mx += (targetX - mx) * 0.1;
        my += (targetY - my) * 0.1;
        glow += (targetGlow - glow) * 0.04;

        orbWraps.forEach(function(wrap) {
          var factor = parseFloat(wrap.getAttribute('data-parallax')) || 1;
          var range = 30 + factor * 25;
          wrap.style.transform = 'translate(' + (mx * range) + 'px, ' + (my * range) + 'px)';
          wrap.style.filter = 'brightness(' + glow + ')';
        });

        requestAnimationFrame(animate);
      }
      animate();
    })();

    // ===== 加载进度（模拟 main.ts 行为） =====
    window.__setLoadProgress__ = function(pct) {
      var bar = document.getElementById('loadProgress');
      if (bar) bar.style.width = Math.min(pct, 100) + '%';
    };

    (function() {
      var steps = [
        { pct: 5, delay: 300 },
        { pct: 20, delay: 500 },
        { pct: 70, delay: 1500 },
        { pct: 85, delay: 400 },
        { pct: 95, delay: 600 },
        { pct: 100, delay: 300 },
      ];
      var totalDelay = 0;
      steps.forEach(function(s) {
        totalDelay += s.delay;
        setTimeout(function() {
          window.__setLoadProgress__(s.pct);
        }, totalDelay);
      });
    })();

    // ===== 主题切换 =====
    function toggleTheme() {
      var html = document.documentElement;
      var isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('__APP__DARK__MODE__', isDark ? 'light' : 'dark');
    }

    // 初始化主题
    (function() {
      var theme = localStorage.getItem('__APP__DARK__MODE__');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</body>
</html>
